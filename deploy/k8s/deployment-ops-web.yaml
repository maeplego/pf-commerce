apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-web
  labels:
    app: commerce-ops-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-ops-web
  template:
    metadata:
      labels:
        app: commerce-ops-web
    spec:
      containers:
        - name: ops-web
          image: pf-commerce-ops-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3010
              name: http
          env:
            - name: PORT
              value: "3010"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_COMMERCE_API_URL
              value: http://commerce-api.localhost
          readinessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 25
            periodSeconds: 10
