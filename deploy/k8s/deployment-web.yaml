apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: commerce-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-web
  template:
    metadata:
      labels:
        app: commerce-web
    spec:
      containers:
        - name: web
          image: pf-commerce-storefront:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3009
              name: http
          env:
            - name: PORT
              value: "3009"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_COMMERCE_API_URL
              value: http://commerce-api.localhost
            - name: NEXT_PUBLIC_COMMERCE_BFF_URL
              value: http://commerce-bff.localhost
          readinessProbe:
            httpGet:
              path: /
              port: 3009
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3009
            initialDelaySeconds: 25
            periodSeconds: 10
